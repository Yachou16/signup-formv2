<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="page-layout">

        <!-- Linker kolom met achtergrond afbeelding-->
        <div class="sidebar">
            <div class="logo-banner">
                <img src="images/logo-sidebar.png" alt="Odin logo">
                <span>ODIN</span>
            </div>
        </div>

<!--    Rechterkolom met formulier-content-->
        <div class="content-side">
          <section class="intro"> <p>This is not a real online service! You know you need 
            something like this in your life to help you realize your deepest dreams. Sign 
        up now to get started.</p><p>You know <em><i>you</i></em> want to</p></section>

        <form action="#" class="signup-form">
            <!-- 1 container voor alle 6 velden -->
            <div class="inputs-container">

                <div class="input-group">
                    <label for="first-name">First Name</label>
                    <input type="text" name="first_name" id="first-name">
                </div>

                <div class="input-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" name="last_name" id="last-name">
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email">
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" name="phone" id="phone">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password">
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm-password">
                </div>

            </div>
        </form>

        <h2>Sign up or create account <button>Sign up</button></h2>
        </div>
    </div>
</body>
</html>
